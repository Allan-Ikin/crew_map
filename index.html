<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18352c"><title>Waste Round Map</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--green:#18352c;--lime:#b7d333;--paper:#f5f6f3;--ink:#17211d;--muted:#647169;--line:#d8ded9;--blue:#2477c3;--grey:#59636c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{background:var(--green);color:white;padding:14px 18px;display:flex;gap:18px;align-items:center;box-shadow:0 2px 10px #0003;z-index:1001}.brand{font-weight:800;font-size:20px;white-space:nowrap}.brand small{display:block;font-size:11px;font-weight:600;color:#dce7df}.selectors{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff17;border:1px solid #ffffff35;color:white;border-radius:9px;padding:9px 12px;font-weight:700}.content{min-height:0;display:grid;grid-template-columns:370px 1fr}.side{background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.rounds{padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;border-bottom:1px solid var(--line)}.round{border:1px solid var(--line);background:#f7f8f6;border-radius:8px;padding:9px 4px;font-weight:800}.round.active{background:var(--blue);color:white;border-color:var(--blue)}.round.r.active{background:var(--grey);border-color:var(--grey)}.searchwrap{padding:12px;border-bottom:1px solid var(--line)}input{width:100%;padding:11px 12px;border:1px solid #bcc7bf;border-radius:9px;font-size:16px}.meta{padding:10px 14px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}.list{overflow:auto;flex:1}.street{width:100%;display:grid;grid-template-columns:34px 1fr 28px;align-items:center;text-align:left;border:0;border-top:1px solid #edf0ed;background:white;padding:10px 11px;font-size:14px}.street:hover,.street.active{background:#eaf3ff}.num{color:#89958d;font-variant-numeric:tabular-nums}.pin{font-size:16px}.mapwrap{position:relative;min-width:0}#map{height:100%;width:100%}.status{position:absolute;left:16px;bottom:16px;z-index:800;background:#18352cee;color:white;padding:10px 13px;border-radius:9px;max-width:520px;font-size:13px;box-shadow:0 2px 10px #0003}.panel{position:absolute;right:14px;top:14px;z-index:800;background:white;padding:13px;border-radius:12px;box-shadow:0 3px 16px #0003;width:275px}.panel h3{margin:0 0 6px}.panel p{margin:5px 0;color:var(--muted);font-size:13px}.legend{display:flex;gap:8px;margin-top:9px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--blue)}@media(max-width:800px){.content{grid-template-columns:310px 1fr}.brand{font-size:17px}.top{padding:10px}.panel{display:none}}@media(max-width:650px){.content{grid-template-columns:1fr;grid-template-rows:44% 56%}.side{border-right:0;border-bottom:1px solid var(--line)}.rounds{grid-template-columns:repeat(5,1fr)}.top{flex-wrap:wrap}.brand small{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">Waste Services<small>Round Mapping Prototype</small></div><div class="selectors"><div class="pill">Fortnight 1</div><div class="pill">Thursday</div><div class="pill" id="currentRound">D1</div></div></header><main class="content"><aside class="side"><div class="rounds" id="roundBtns"></div><div class="searchwrap"><input id="search" placeholder="Search this round…"></div><div class="meta"><span id="count"></span><span>Tap a street to locate</span></div><div class="list" id="streetList"></div></aside><section class="mapwrap"><div id="map"></div><div class="panel"><h3 id="panelTitle">D1</h3><p id="panelText">Select a street from the list. The app will locate it using OpenStreetMap and remember it on this device.</p><div class="legend"><span><i class="dot"></i> Recycling round</span></div></div><div class="status" id="status">Loaded from your KMZ. Streets without stored coordinates are located only when tapped.</div></section></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="rounds.js"></script><script>
const data=window.ROUND_DATA;let active=Object.keys(data.rounds)[0],marker=null;const cache=JSON.parse(localStorage.getItem('roundMapGeocodes')||'{}');
const map=L.map('map',{zoomControl:true}).setView([53.72,-2.69],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderButtons(){const el=$('#roundBtns');el.innerHTML='';Object.keys(data.rounds).forEach(r=>{const b=document.createElement('button');b.className='round '+(r.startsWith('R')?'r ':'')+(r===active?'active':'');b.textContent=r;b.onclick=()=>{active=r;$('#currentRound').textContent=r;renderButtons();renderList();fitKnown();};el.appendChild(b)});}
function renderList(){const q=$('#search').value.trim().toLowerCase();const rows=data.rounds[active].filter(x=>x.name.toLowerCase().includes(q));$('#count').textContent=`${rows.length} streets`;$('#panelTitle').textContent=active;$('#streetList').innerHTML=rows.map(x=>`<button class="street" data-name="${esc(x.name)}"><span class="num">${x.order}</span><span>${esc(x.name.replace(/ - /g,' · '))}</span><span class="pin">${(x.lat||cache[x.name])?'●':'⌖'}</span></button>`).join('');document.querySelectorAll('.street').forEach(b=>b.onclick=()=>locate(b.dataset.name,b));}
function fitKnown(){const pts=data.rounds[active].map(x=>x.lat?[x.lat,x.lng]:(cache[x.name]?[cache[x.name].lat,cache[x.name].lng]:null)).filter(Boolean);if(pts.length)map.fitBounds(pts,{padding:[50,50],maxZoom:15});}
async function locate(name,button){document.querySelectorAll('.street').forEach(x=>x.classList.remove('active'));button.classList.add('active');let p=cache[name];const rec=data.rounds[active].find(x=>x.name===name);if(rec.lat)p={lat:rec.lat,lng:rec.lng,display:name};if(!p){$('#status').textContent=`Locating ${name}…`;try{const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q='+encodeURIComponent(name.replace(' - ', ', '));const res=await fetch(url,{headers:{'Accept':'application/json'}});const js=await res.json();if(!js.length)throw new Error('No exact match found');p={lat:+js[0].lat,lng:+js[0].lon,display:js[0].display_name};cache[name]=p;localStorage.setItem('roundMapGeocodes',JSON.stringify(cache));renderList();}catch(e){$('#status').textContent=`Could not locate ${name}. It remains in the round list and can be manually mapped in an editor version.`;return;}}
if(marker)marker.remove();marker=L.marker([p.lat,p.lng]).addTo(map).bindPopup(`<b>${esc(name)}</b><br>${esc(p.display||'Stored KMZ location')}<br><br><small>Round ${active} · Fortnight 1 Thursday</small>`).openPopup();map.setView([p.lat,p.lng],17);$('#status').textContent=`${name} · Round ${active}`;$('#panelTitle').textContent=name.replace(' - ',' · ');$('#panelText').textContent=`Collection order ${rec.order} on ${active}. Operational notes, access directions and reversing warnings would appear here.`;}
$('#search').addEventListener('input',renderList);renderButtons();renderList();fitKnown();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
